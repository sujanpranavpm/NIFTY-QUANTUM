# NIFTY QUANT — P2 reproducible dependency contract
#
# The exact interpreter and library versions every P2 stage was validated on.
# This file is the reproducibility contract referenced by PROJECT docs and by
# `scripts/_p2_env_check.py` (which fails closed when the live environment drifts).
#
# Reproduce with:   pip install -r requirements.lock
# Then verify with: python scripts/_p2_env_check.py
#
# Interpreter (not pip-installable; recorded so the pins below are unambiguous):
#   CPython 3.12.10
#
# These are the DIRECT, top-level pins. They are deliberately not a full transitive
# `pip freeze`: this is a contract for the packages the project imports, not a
# machine-specific snapshot of every wheel pulled in. Audit-only libraries are kept
# separate in spirit (see requirements-audit.txt) but are pinned here too so a
# reviewer can reproduce the offline data-verification scripts exactly.

