# Pytest configuration — see PROJECT_HANDOFF.md "Test discovery".
#
# `testpaths` is the reason the official command is simply `pytest`: without it a
# bare run from the repo root also collects vendor/quantjourney-bt/tests/, which
# imports a package (`backtester`) that is not installed here, and pytest aborts
# with 8 collection errors before any project test runs. Nothing under vendor/ was
# modified to achieve that.
[pytest]
testpaths = tests
norecursedirs = vendor .* build dist node_modules __pycache__ data artifacts logs reports scripts
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
